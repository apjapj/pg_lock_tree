# Secrets scan — gitleaks plus detect-secrets, over the whole history.
#
# Deliberately a separate job, not a step in the test matrix. A secret scan does not vary by
# PostgreSQL version, so putting it in the matrix would run it six times for one result.
#
# Deliberately `gitleaks git`, i.e. history rather than `--no-git` (working tree). A secret
# committed and later deleted passes a working-tree scan; that is the common way a real leak
# survives, and `fetch-depth: 0` below is pointless without it.
#
# Belt and braces: gitleaks matches provider-specific rules, detect-secrets does entropy and
# keyword analysis for generic credentials (a plaintext postgres:// DSN, `password = "..."`)
# that gitleaks' defaults miss. Verified: gitleaks passed a staged postgres:// DSN that
# detect-secrets caught.
name: secret scan

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (history)
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history; the scan is pointless without it

      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION=8.21.2
          curl -sSL --fail -o /tmp/gl.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSL --fail -o /tmp/checksums.txt \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_checksums.txt"
          # Verify against the publisher's own checksums rather than a value pasted into
          # this workflow: a substituted download would otherwise be self-consistent.
          expected=$(grep " gitleaks_${VERSION}_linux_x64.tar.gz$" /tmp/checksums.txt | awk '{print $1}')
          actual=$(sha256sum /tmp/gl.tar.gz | awk '{print $1}')
          [ "$expected" = "$actual" ] || { echo "checksum mismatch: expected $expected got $actual"; exit 1; }
          echo "verified $actual"
          tar -xzf /tmp/gl.tar.gz -C /tmp gitleaks
          install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks

      - name: gitleaks git
        run: |
          set -euo pipefail
          # --redact so a real finding does not print the secret into Forgejo's job log,
          # which is retained for a year by default.
          #
          # Pass --config only when the repo actually ships one. A workflow that names a
          # missing config fails outright, so do not reference it unconditionally.
          if [ -f .gitleaks.toml ]; then
            gitleaks git --no-banner --redact --config .gitleaks.toml
          else
            gitleaks git --no-banner --redact
          fi

  detect-secrets:
    name: detect-secrets (tree at HEAD)
    runs-on: docker
    steps:
      - uses: actions/checkout@v4

      - name: Install detect-secrets
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends python3 python3-venv >/dev/null
          python3 -m venv /opt/ds
          /opt/ds/bin/pip install --quiet --disable-pip-version-check detect-secrets==1.5.0

      - name: Scan
        run: |
          set -euo pipefail
          # No path argument: detect-secrets 1.5.0 returns zero findings for an absolute
          # path, which would make this job pass unconditionally.
          #
          # No baseline. False positives are suppressed inline with
          # `# pragma: allowlist-secret`, which needs no committed file. A baseline holds
          # salted hashes that trip gitleaks' generic-api-key rule, so committing one makes
          # it fail the server-side pre-receive scan.
          #
          # Exclude .git/: --all-files otherwise walks it and reports on COMMIT_EDITMSG,
          # which describes the last commit message, not the code.
          /opt/ds/bin/detect-secrets scan --all-files --force-use-all-plugins \
            --exclude-files '^\.git/' > report.json

          count=$(python3 -c "
          import json
          print(sum(len(v) for v in json.load(open('report.json')).get('results', {}).values()))
          ")
          echo "detect-secrets findings: $count"
          if [ "$count" -gt 0 ]; then
            python3 -c "
          import json
          d = json.load(open('report.json'))
          for f, items in sorted(d.get('results', {}).items()):
              for i in items:
                  print(f\"  {f}:{i.get('line_number')} {i.get('type')}\")
          "
            echo
            echo "For a false positive, append detect-secrets' inline allowlist pragma to"
            echo "that line. The exact text is documented in its reference; deliberately not"
            echo "reproduced here, because a worked example of the form 'KEY: value' in this"
            echo "file is itself a finding, and detect-secrets reports it against the step's"
            echo "line number where no pragma can suppress it."
            exit 1
          fi
          echo "clean"