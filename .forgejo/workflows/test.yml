# .forgejo/workflows/test.yml: pg_lock_tree logic tests on PG 14-19.
# CI loads the SQL file directly (no make install: the database runs in a separate service
# container). Packaging and CREATE EXTENSION are covered locally by scripts/matrix.sh.
name: test matrix

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to package and validate'
        required: true
        default: 'v1.2.1'

# Least privilege, stated rather than inherited. These jobs check the repository out and
# read a database; none of them writes to the repository, creates a release, or needs a
# token wider than read access to the contents. Declaring it here means a later change
# cannot quietly widen it, and it matches what the secret scan workflows in this family
# already declare.
permissions:
  contents: read

jobs:
  pgtap:
    # The PostgreSQL pool label, not docker, and deliberately so. The label below is the name the
    # self-hosted runner registered with Forgejo and must match it exactly; it is functional, not prose.
    #
    # `docker` is advertised by two self-hosted runners on this instance. A job on `docker` is therefore placed on whichever runner polls
    # first, and that is not a property this workflow can reason about. It bit hard: for months
    # the matrix reported five or six of six failing in 0 seconds, which looked like a lost
    # concurrency slot and was not one. The runner that won those jobs could not pull this
    # repository's own test images at all, because the second host's Docker daemon has no
    # insecure-registries entry for the Forgejo registry and so tries HTTPS against a plain HTTP
    # port and dies. The surviving job was whichever the first runner happened to claim.
    #
    # The pool label below is advertised by that first runner alone. Placement is deterministic, and it is
    # the only host configured to pull from that registry. The `docker` label is untouched, so
    # every other repository on the instance is unaffected.
    #
    # lint.yml and secrets.yml stay on `docker` on purpose. They pull nothing private, so they
    # run correctly on either host, and they are not PostgreSQL-specific enough to belong in a
    # pool named for it.
    runs-on: babar-pg
    strategy:
      fail-fast: false
      matrix:
        # Ascending, and that is now cosmetic rather than load-bearing. A previous commit put
        # 19rc1 first to test whether the job that failed was failing by position in the matrix
        # or by being the beta image. It was neither: Forgejo sorts permutations by value, so
        # 19rc1 was always dispatched last, and being dispatched last is what put it on the
        # other runner. With runs-on pinned to the pool label the order no longer decides anything, so
        # it goes back to the order internal-tooling builds the images in.
        pg_version: ["14", "15", "16", "17", "18", "19rc1"]   # keep in step with internal-tooling
    services:
      postgres:
        # The private registry, from a repository variable rather than written here.
        # 
        # This is where the address of the Forgejo host belongs: it is a property of
        # the instance the runner is registered with, not of this repository, and a
        # file about to be public is the wrong place for it. Set PG_TEST_REGISTRY under
        # Settings -> Actions -> Variables. The same shape as BOOK_IMAGE_PREFIX in the
        # book, which exists for the same reason: which registry you pull from is
        # environment, not content.
        # 
        # The runner pool label is deliberately NOT parameterised: it must match the
        # name the runner registered exactly, so it is functional, not configuration.
        image: ${{ vars.PG_TEST_REGISTRY }}/pg-test:${{ matrix.pg_version }}
        env:
          # the throwaway password for a disposable test container, not a credential.
          # detect-secrets' Secret Keyword plugin flags any PASSWORD assignment; the pragma
          # suppresses it in place, which avoids committing a .secrets.baseline.
          POSTGRES_PASSWORD: test # pragma: allowlist-secret
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        # No `command:` override here on purpose. Forgejo v16 ignores it on a service, so two
        # things this suite needs could not be set here: max_prepared_transactions, without
        # which test/04_prepared.sql has nothing to test, and shared_preload_libraries=pg_cron,
        # without which pg_cron refuses to create jobs and test/06_cron.sql has nothing to
        # schedule. Both live in the pg-test image's own CMD instead, and both tests skip
        # themselves when the setting is absent, so this workflow still passes on an image
        # that predates them.
        #
        # pg_cron is a dependency of the harness, not of pg_lock_tree: the extension needs no
        # shared_preload_libraries and six of the seven test files run without one.
        # test/07_history.sql also needs no pg_cron, since it calls lock_tree_sample() directly
        # rather than scheduling it.
    env:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: test # pragma: allowlist-secret  # throwaway, same as POSTGRES_PASSWORD above
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # No apt step, and that is the point of the pool's runner image: it carries
        # postgresql-client-18, pg_prove and libtap-parser-sourcehandler-pgtap-perl, so the matrix
        # used to pay an apt-get per job to install what was already present. Verified in
        # apjapj/pg-runner:18: pg_prove takes a test file to PASS with nothing installed first.
        #
        # It also drops the last per-job dependency on the Debian mirror being reachable, which is
        # the fragility secrets.yml was refactored away from: a security gate should not depend on
        # the Debian mirror at job time.
      - name: Wait for Postgres
        run: until pg_isready -q; do sleep 1; done
      - name: Load pg_lock_tree into public
        run: |
          # check_function_bodies=off is load-bearing, not a convenience.
          #
          # CI loads the release SQL directly rather than CREATE EXTENSION, because the
          # server is a separate service container whose own copy of the extension is
          # whatever was baked into the image, not this working tree. Direct loading runs
          # the statements in file order with default settings, and in that order
          # lock_tree_sampling_advice() is defined before lock_tree_history exists:
          # 1.1.2 defines the function at line 1483 with a LANGUAGE sql body that selects
          # FROM lock_tree_history, and creates the table at line 1587.
          #
          # PostgreSQL validates a sql function body when the function is created, so with
          # the default check_function_bodies=on the load aborts there with
          #   ERROR: relation "public.lock_tree_history" does not exist
          # ON_ERROR_STOP=1 stops the script, the table and every object after line 1483
          # are never created, and the suite runs 161 of its 423 tests with most files
          # dying before they produce a plan. CREATE EXTENSION does not hit this, which is
          # why every local run passed and CI never did.
          #
          # Verified on PostgreSQL 18: with the setting off the same load reports zero
          # errors, creates lock_tree_history, and the suite runs 364 tests instead of 161.
          # Turning body validation off is safe here because pgTAP exercises every one of
          # those bodies immediately afterwards.
          #
          # The deeper fix is to create the table before the function that reads it, so the
          # release file loads correctly with default settings in any order. That is a
          # change to the release script itself, so it belongs in a release rather than here.
          # The single quotes are load-bearing too. Written as "/^\\echo Use/d" the shell
          # hands sed /^\echo Use/d, and GNU sed reads \e as ESC, so the pattern means
          # "start with ESC followed by cho" and matches nothing. The \echo line therefore
          # survives, psql reaches the \quit on that same line, and the load stops
          # immediately having created no objects at all. Verified: that form prints the
          # echoed line and leaves zero lock_tree objects in the database.
          { echo 'SET check_function_bodies = off;'
            sed -e '/^\\echo Use/d' -e 's/@extschema@/public/g' \
              "pg_lock_tree--$(sed -n "s/^default_version *= *'\(.*\)'/\1/p" pg_lock_tree.control).sql"
          } | psql -qX -v ON_ERROR_STOP=1
      - name: pgTAP
        run: pg_prove --dbname postgres test/*.sql

  # The install-path checks, which the pgTAP matrix above cannot run.
  #
  # Eight checks (scripts/check-*.sh, scenarios/run.sh, and demo.sql) gate on a row in pg_extension,
  # which only exists if the extension was installed with CREATE EXTENSION. The matrix above
  # deliberately does not do that: it loads the release SQL straight into public on a separate
  # service container.
  #
  # This job runs on the PostgreSQL pool label, backed by internal-tooling's apjapj/pg-runner:18 image.
  # The runner pre-bakes the PostgreSQL 18 stack (pg_cron, pg_stat_statements, max_prepared_transactions=10),
  # developer headers, and the pg-start startup helper. This allows full in-job CREATE EXTENSION
  # execution without mounting /var/run/docker.sock or running sibling Docker containers.
  install-path-checks:
    name: install-path checks
    runs-on: babar-pg
    env:
      PGUSER: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start Postgres and install extension
        run: |
          set -euo pipefail
          pg-start
          make install
          psql -qX -v ON_ERROR_STOP=1 -c "CREATE EXTENSION pg_lock_tree"
          # Assert, do not print. A bare SELECT reports whatever is installed and is then
          # discarded, so a partial or stale `make install` would pass unnoticed. This is the one
          # thing that must not drift: these checks exist to test THIS working tree, not whatever
          # the image happened to carry.
          want=$(sed -n "s/^default_version *= *'\(.*\)'/\1/p" pg_lock_tree.control)
          got=$(psql -X -tAc "SELECT extversion FROM pg_extension WHERE extname = 'pg_lock_tree'")
          echo "control says ${want}, server loaded ${got}"
          [ -n "$want" ] && [ "$got" = "$want" ] || {
            echo "the loaded version is not this checkout" >&2; exit 1;
          }

      - name: Run the checks
        run: |
          set -uo pipefail
          fail=0
          # All checks that gate on a pg_extension row
          for s in check-upgrade check-install check-schema check-examples \
                   check-alert check-deadlock; do
            printf '=== %s ===\n' "$s"
            if ./scripts/$s.sh; then
              printf '    ok %s\n' "$s"
            else
              printf '    FAIL %s\n' "$s"
              fail=1
            fi
          done

          printf '=== scenarios/run.sh ===\n'
          if ./scenarios/run.sh; then printf '    ok scenarios\n'
          else printf '    FAIL scenarios\n'; fail=1; fi

          printf '=== demo.sql ===\n'
          if psql -qX -v ON_ERROR_STOP=1 -f demo.sql; then printf '    ok demo.sql\n'
          else printf '    FAIL demo.sql\n'; fail=1; fi

          exit $fail

  # The same command as the GitHub copy runs. This job container has no Docker socket, so
  # check-defects.sh runs --local against the postgres service: a scratch DATABASE per run, the release
  # script loaded into it, dropped with FORCE. The pg-test image carries the max_prepared_transactions
  # and pg_cron settings a scratch database inherits. See defects/README.md.
  defects:
    runs-on: babar-pg
    services:
      postgres:
        image: ${{ vars.PG_TEST_REGISTRY }}/pg-test:18
        env:
          POSTGRES_PASSWORD: test # pragma: allowlist-secret
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: test # pragma: allowlist-secret
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Wait for Postgres
        run: until pg_isready -q; do sleep 1; done
      - run: make defects PG=18

  # A public-release dry run: generate the PGXN package from a tag, validate its META.json with
  # PGXN's own validator, and make no network call that changes anything. No credential is read.
  #
  # Sources, read for this job:
  #   PGXN Meta Spec 1.0.0, https://pgxn.org/meta/spec.txt: required keys are name, abstract,
  #   version, maintainer, license, provides and meta-spec; prereqs and resources are optional.
  #   PGXN Manager How To, https://manager.pgxn.org/howto: "You can also check it before uploading
  #   by installing PGXN::Meta::Validator and running: validate_pgxn_meta META.json".
  #   pgxn/pgxn-tools, https://github.com/pgxn/docker-pgxn-tools: pgxn-bundle calls
  #   `pgxn validate-meta META.json` (the same PGXN::Meta::Validator).
  #
  # The babar-pg runner has no Docker socket, so the validator is installed from CPAN into the
  # runner's home directory instead of using the pgxn/pgxn-tools image. The job reads a tag and the
  # current stable pgxn.toml, builds from the tag with git archive, and checks the zip has exactly
  # one top-level directory. The API check is GET-only.
  pgxn:
    name: PGXN package dry run
    runs-on: babar-pg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Build and validate the PGXN package
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [ -n "${TAG_INPUT:-}" ]; then
            tag="$TAG_INPUT"
          elif [ "${GITHUB_REF_TYPE:-}" = tag ] || [ "${GITHUB_REF:-}" = refs/tags/* ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v1.2.1"
          fi
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "release tag must look like v1.2.1, got '$tag'" >&2; exit 1 ;;
          esac
          version="${tag#v}"

          test -f scripts/pgxn-meta.py
          test -f pgxn.toml
          git fetch --tags --force origin >/dev/null

          # The tag predates pgxn.toml and scripts/pgxn-meta.py in this repository. The package
          # comes from the tag; the generator and the stable identity fields come from main.
          worktree=$(mktemp -d)
          tmp=$(mktemp -d)
          cleanup() {
            git worktree remove --force "$worktree" >/dev/null 2>&1 || true
            rm -rf "$worktree" "$tmp"
          }
          trap cleanup EXIT
          git worktree add --detach "$worktree" "$tag" >/dev/null
          mkdir -p "$worktree/scripts"
          cp scripts/pgxn-meta.py "$worktree/scripts/pgxn-meta.py"
          cp pgxn.toml "$worktree/pgxn.toml"

          control_version=$(git -C "$worktree" show "$tag:pg_lock_tree.control" \
            | sed -n "s/^default_version *= *'\([^']*\)'/\1/p")
          [ "$control_version" = "$version" ] || {
            echo ".control at $tag says '$control_version', tag says '$version'" >&2
            exit 1
          }
          git -C "$worktree" show "$tag:CHANGELOG.md" > "$tmp/CHANGELOG.md"
          grep -qF "## ${version} " "$tmp/CHANGELOG.md" || {
            echo "CHANGELOG.md at $tag has no '## ${version}' entry" >&2
            exit 1
          }

          mkdir -p build/pgxn
          python3 "$worktree/scripts/pgxn-meta.py" --tag "$tag" \
            --output "build/pgxn/META.json"
          python3 "$worktree/scripts/pgxn-meta.py" --tag "$tag" \
            --package "build/pgxn/pg_lock_tree-${version}.zip"

          # PGXN::Meta::Validator's CLI has an argument-parsing quirk: it reads META.json from
          # the current directory. Install it without root, then validate from the package root.
          if ! command -v validate_pgxn_meta >/dev/null 2>&1; then
            if command -v cpanm >/dev/null 2>&1; then
              cpanm_cmd=cpanm
            else
              cpanm_cmd=/tmp/cpanm
              curl -fsSL https://cpanmin.us -o "$cpanm_cmd"
              chmod +x "$cpanm_cmd"
            fi
            "$cpanm_cmd" --notest --local-lib "$HOME/.local" PGXN::Meta::Validator
            export PATH="$HOME/.local/bin:$PATH"
            export PERL5LIB="$HOME/.local/lib/perl5${PERL5LIB:+:$PERL5LIB}"
          fi
          command -v validate_pgxn_meta >/dev/null

          prefix="pg_lock_tree-${version}/"
          python3 - "$PWD/build/pgxn/pg_lock_tree-${version}.zip" "$prefix" "$tmp" <<'PY'
          import json
          import sys
          import zipfile

          zip_path, prefix, dest = sys.argv[1], sys.argv[2], sys.argv[3]
          with zipfile.ZipFile(zip_path) as z:
              names = z.namelist()
              tops = {name.split("/", 1)[0] for name in names if name}
              if tops != {prefix.rstrip("/")}:
                  raise SystemExit("package does not have exactly one top-level directory: %r" % sorted(tops))
              if prefix + "META.json" not in names:
                  raise SystemExit("META.json is not at the package root")
              meta = json.loads(z.read(prefix + "META.json"))
              for ext, info in meta["provides"].items():
                  if prefix + info["file"] not in names:
                      raise SystemExit("provides file for %s is missing: %s" % (ext, info["file"]))
              z.extract(prefix + "META.json", dest)
          print("package contains one top-level directory and every provides file")
          PY

          ( cd "$tmp/$prefix" && validate_pgxn_meta )
          sha256sum "build/pgxn/pg_lock_tree-${version}.zip"

          # Read-only PGXN API check. 404 means the name/version is free; 200 means taken; any other
          # status is treated as a failure rather than as permission to continue.
          for endpoint in \
            "https://api.pgxn.org/dist/pg_lock_tree" \
            "https://api.pgxn.org/dist/pg_lock_tree/${version}"; do
            code=$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' "$endpoint") || {
              echo "cannot read $endpoint" >&2
              exit 1
            }
            case "$code" in
              404) echo "free: $endpoint" ;;
              200) echo "already taken: $endpoint" >&2; exit 1 ;;
              *) echo "unexpected HTTP $code from $endpoint" >&2; exit 1 ;;
            esac
          done
