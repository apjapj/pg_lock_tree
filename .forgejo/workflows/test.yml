# .forgejo/workflows/test.yml v0.1 — pg_lock_tree logic tests on PG 14–19.
# CI loads the SQL file directly (no make install: the database runs in a separate service
# container). Packaging and CREATE EXTENSION are covered locally by scripts/matrix.sh.
name: test matrix

on:
  push:
  pull_request:

jobs:
  pgtap:
    runs-on: docker
    strategy:
      fail-fast: false
      matrix:
        pg_version: ["14", "15", "16", "17", "18", "19beta4"]
    services:
      postgres:
        image: 192.168.10.111:3000/apjapj/pg-test:${{ matrix.pg_version }}
        env:
          POSTGRES_PASSWORD: test
    env:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: test
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Client tools
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends postgresql-client libtap-parser-sourcehandler-pgtap-perl
      - name: Wait for Postgres
        run: until pg_isready -q; do sleep 1; done
      - name: Load pg_lock_tree into public
        run: |
          sed -e '/^\\echo Use/d' -e 's/@extschema@/public/g' pg_lock_tree--0.1.sql \
            | psql -qX -v ON_ERROR_STOP=1
      - name: pgTAP
        run: pg_prove --dbname postgres test/*.sql
